name: CI
# Runs on every pull request, and on main after a merge
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build # type-checks, then builds the game
      - run: npm run format:check
      - run: npm test
