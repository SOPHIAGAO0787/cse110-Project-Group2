name: GitHub Pages
# Publishes the game to GitHub Pages after every merge to main
on:
  push:
    branches: [main]
  workflow_dispatch: # also lets someone publish by hand from the Actions tab
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      # --base=./ makes the page load its files next to itself, under the repo's Pages path
      - run: npm run build -- --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
